name: Pull Requests
on:
  pull_request:
    types: [opened, reopened, edited]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            registry.npmjs.org:443
            nodejs.org:443
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.x"
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11
      - name: Install deps
        run: pnpm ci
      - name: Run tests
        run: pnpm test
